# Builds the Everything-enabled fork. On main: a Debug x64 build check with the
# package uploaded as an artifact. On version tags (v*): Release sideload MSIX
# bundles for x64 and ARM64 attached to a GitHub Release.

name: Everything Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build and publish sideload release packages'
        type: boolean
        default: false

env:
  WORKING_DIR: ${{ github.workspace }}
  SOLUTION_PATH: '${{ github.workspace }}\Files.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\Files.App\Files.App.csproj'
  APPX_PACKAGE_DIR: '${{ github.workspace }}\artifacts\AppxPackages\'
  APPX_SELFSIGNED_CERT_PATH: '${{ github.workspace }}\.github\workflows\FilesApp_SelfSigned.pfx'

jobs:

  build:

    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]
    env:
      PLATFORM: ${{ matrix.platform }}
      CONFIGURATION: Debug

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore Files
      shell: pwsh
      run: |
        msbuild $env:SOLUTION_PATH `
          -t:Restore `
          -p:Platform=$env:PLATFORM `
          -p:Configuration=$env:CONFIGURATION `
          -p:PublishReadyToRun=true `
          -v:quiet

    - name: Build Files
      run: |
        msbuild `
          $env:APP_PROJECT_PATH `
          -t:Build `
          -p:Configuration=$env:CONFIGURATION `
          -p:Platform=$env:PLATFORM `
          -p:AppxBundle=Never `
          -p:GenerateAppxPackageOnBuild=false `
          -v:quiet

    - name: Upload build outputs
      uses: actions/upload-artifact@v7
      with:
        name: 'Files build (Debug, x64)'
        path: ${{ github.workspace }}\src\Files.App\bin\x64\Debug\**\*
        if-no-files-found: warn

  package:

    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    env:
      PLATFORM: ${{ matrix.platform }}

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore Files
      shell: pwsh
      run: |
        msbuild $env:SOLUTION_PATH `
          -t:Restore `
          -p:Platform=$env:PLATFORM `
          -p:Configuration=Release `
          -p:PublishReadyToRun=true `
          -v:quiet

    - name: Create self signed cert as a pfx file
      run: ./.github/scripts/Generate-SelfCertPfx.ps1 -Destination "$env:APPX_SELFSIGNED_CERT_PATH"

    - name: Build & package Files
      run: |
        msbuild `
          $env:APP_PROJECT_PATH `
          -t:Build `
          -p:Configuration=Release `
          -p:Platform=$env:PLATFORM `
          -p:AppxBundlePlatforms=$env:PLATFORM `
          -p:AppxBundle=Always `
          -p:GenerateAppxPackageOnBuild=true `
          -p:UapAppxPackageBuildMode=SideloadOnly `
          -p:AppxPackageDir=$env:APPX_PACKAGE_DIR `
          -p:AppxPackageSigningEnabled=true `
          -p:PackageCertificateKeyFile=$env:APPX_SELFSIGNED_CERT_PATH `
          -p:PackageCertificatePassword="" `
          -p:PackageCertificateThumbprint="" `
          -v:quiet

    - name: Stage packages
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "$env:WORKING_DIR\artifacts\staging" | Out-Null
        Get-ChildItem $env:APPX_PACKAGE_DIR -Recurse -Include *.msixbundle, *.msix, *.cer, Add-AppDevPackage.ps1, *.txt -Exclude *Dependencies* |
          ForEach-Object {
            $dest = Join-Path "$env:WORKING_DIR\artifacts\staging" $_.Name
            Copy-Item $_.FullName $dest -Force
          }
        Get-ChildItem "$env:WORKING_DIR\artifacts\staging"

    - name: Upload packages to the artifact
      uses: actions/upload-artifact@v7
      with:
        name: 'Sideload Packages (${{ matrix.platform }})'
        path: ${{ github.workspace }}\artifacts\staging\**

    - name: Attach packages to the release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ github.workspace }}\artifacts\staging\**\*